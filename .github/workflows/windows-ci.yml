name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-freeze:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-swig
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-cppzmq
            mingw-w64-x86_64-jsoncpp
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-python-wheel
            mingw-w64-x86_64-python-pyqt5
            mingw-w64-x86_64-python-cx-freeze
            mingw-w64-x86_64-python-pyzmq
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-pyopengl

      - name: Install pinned Python dependencies
        shell: msys2 {0}
        run: python -m pip install --break-system-packages -r scripts/windows-requirements.txt

      - name: Build, test, freeze, and smoke test
        shell: pwsh
        run: .\scripts\build-windows.ps1 -MsysRoot C:\msys64
